<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF6EA">
<title>Peapod plan test bench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800;900&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body data-view="plan">
<header class="top">
  <div class="brand"><span class="pea" aria-hidden="true"></span><span>Peapod</span><em>test bench</em></div>
  <div class="top-meta" id="dataset-note"></div>
  <a class="link" href="/logout">Sign out</a>
</header>

<main class="app">
  <section class="view" id="v-pod" aria-label="Pod"></section>
  <div class="right">
    <nav class="tabs" aria-label="Sections">
      <button data-view="pod" class="only-mobile">Pod</button>
      <button data-view="plan">Plan</button>
      <button data-view="inspect">Inspect</button>
      <button data-view="tune">Tune</button>
      <button data-view="log">Log</button>
    </nav>
    <section class="view" id="v-plan" aria-label="Plan"></section>
    <section class="view" id="v-inspect" aria-label="Inspect"></section>
    <section class="view" id="v-tune" aria-label="Tune"></section>
    <section class="view" id="v-log" aria-label="Log"></section>
  </div>
</main>

<div id="sheet" class="sheet" hidden><div class="sheet-card" role="dialog" aria-modal="true"><div id="sheet-body"></div></div></div>
<div id="toast" class="toast" hidden></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
