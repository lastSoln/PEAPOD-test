# Fly.io: `fly launch --copy-config --no-deploy`, then
#   fly volumes create bench_data --size 1 --region sin
#   fly secrets set BENCH_PASSWORD=...
#   fly deploy
app = "peapod-bench"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  BENCH_DB = "/data/bench.sqlite"

[mounts]
  source = "bench_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  memory = "512mb"
  cpus = 1
